# Tube Guide: simple London Underground directions for visitors.
# Contract rules: CLAUDE.md in the hackathon repository.

manifest_version: 1

persistence: none

# CHECK-IN: your public pseudonym (3 to 30 characters; never your real name
# or an email address). Nothing publishes while this is empty.
app_author_name: "chakshu-c and arnavpopley"

app:
  # CHECK-IN: the repository sets this itself ("Set app.id from the
  # repository name"). Keep the id that commit wrote; do not copy this line
  # over it.
  id: hack.app_e28a
  name: Tube Guide
  version: 0.1.1
  # Never the word "by" here: the badge is parsed on it.
  summary: >-
    Says which London Underground train to take between two stations or
    landmarks, where to change and when to get off, with exact sign wording.
    Asks TfL for live trains when it can.

agent_types:
  - personal

outcomes:
  - id: tube.route
    summary: Tube directions between two London places, step by step, or say when walking is quicker
    example_phrases:
      - which tube do i take from
      - how do i get to on the tube
      - which train do i take to
      - tube or walk from
      - how do i get between two tube stations
      - which platform do i need for
      - how many stops from
      - is it quicker to walk from
    inputs:
      - name: from_place
        type: string
        required: false
        description: >-
          Where the journey starts, exactly as the user wrote it: a London
          station, a landmark or an area, in any language. If the message does
          not say where they start, return an empty string. Never guess.
      - name: to_place
        type: string
        required: false
        description: >-
          Where the journey ends, exactly as the user wrote it: a London
          station, a landmark or an area, in any language. If the message does
          not say where they are going, return an empty string. Never guess.
    output:
      - name: recommendation
        type: string
        description: '"walk" or "tube".'
      - name: steps
        type: array
        item_type: string
        description: >-
          Ordered instructions in English. Text in double quotes is exact
          signage (station, line, platform and train destination names): show
          it unchanged, never translate it.
      - name: tube_minutes
        type: integer
        description: Minutes by Tube, door to door (0 if there is no Tube route).
      - name: walk_minutes
        type: integer
        description: Minutes on foot for the whole journey.
      - name: changes
        type: integer
        description: Number of changes of train.
      - name: next_trains
        type: array
        item_type: string
        description: >-
          Up to 3 live trains at the first platform, each with whether to
          board it. Empty when live data is unavailable.
      - name: service_status
        type: string
        description: TfL's own status wording for the lines used, or that it could not be checked.
      - name: uses_live_data
        type: boolean
        description: True when any part of the answer came from live TfL data.
      - name: data_note
        type: string
        description: Attribution required by TfL.
